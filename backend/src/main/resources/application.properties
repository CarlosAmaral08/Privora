# Nome da aplicacao
spring.application.name=privacidade-portal

# Porta do backend
server.port=8080

# Banco H2 em arquivo (fica salvo em backend/data/privacydb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/privacydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades (bom para protótipo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console do H2 disponivel apenas em desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS - origens exatas, separadas por virgula. Acrescente chrome-extension://<id>
# em CORS_ALLOWED_ORIGINS para autorizar uma instalacao especifica da extensao.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://privora.zapeu.net}

# OpenRouter - a chave nunca deve ser adicionada a este arquivo ou ao repositorio
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.timeout=${OPENROUTER_TIMEOUT:30s}
openrouter.max-output-tokens=${OPENROUTER_MAX_OUTPUT_TOKENS:2500}

# Protecao em memoria do endpoint caro de analise. O estado e local a esta instancia.
privora.rate-limit.enabled=${PRIVORA_RATE_LIMIT_ENABLED:true}
privora.rate-limit.short-requests=${PRIVORA_RATE_LIMIT_SHORT_REQUESTS:10}
privora.rate-limit.short-window=${PRIVORA_RATE_LIMIT_SHORT_WINDOW:10m}
privora.rate-limit.daily-requests=${PRIVORA_RATE_LIMIT_DAILY_REQUESTS:30}
privora.rate-limit.daily-window=${PRIVORA_RATE_LIMIT_DAILY_WINDOW:24h}
privora.rate-limit.global-daily-requests=${PRIVORA_RATE_LIMIT_GLOBAL_DAILY_REQUESTS:200}
privora.rate-limit.max-concurrent=${PRIVORA_RATE_LIMIT_MAX_CONCURRENT:3}
privora.rate-limit.trust-cloudflare-ip=${PRIVORA_TRUST_CLOUDFLARE_IP:false}
