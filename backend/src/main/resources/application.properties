# Nome da aplicacao
spring.application.name=privacidade-portal

# Porta do backend
server.port=8080

# Banco H2 em arquivo (fica salvo em backend/data/privacydb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/privacydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades (bom para protótipo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console do H2 disponivel apenas em desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS - libera o frontend rodando no Vite (porta 5173) para chamar a API
app.cors.allowed-origin=https://privora.zapeu.net
